{% extends 'acervo/base.html' %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block conteudo %}
<h1>{{ titulo }}</h1>

<form method="post" class="formulario">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Salvar</button>
  <a class="botao secundario" href="{{ voltar|default:'javascript:history.back()' }}">Cancelar</a>
</form>
{% endblock %}
